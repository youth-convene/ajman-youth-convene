name: Deploy to GitHub Pages

# Builds the React app in app/ and publishes it to GitHub Pages
# on every push to main. Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The API URL comes from the VITE_API_URL repository variable if set,
      # otherwise from app/.env. Without it the app would silently run in demo
      # mode and registrations would never reach the Google Sheet, so stop here.
      - name: Check VITE_API_URL is set
        env:
          VAR_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -n "$VAR_URL" ]; then
            echo "Using VITE_API_URL from the repository variable."
          elif grep -qE '^VITE_API_URL=\S+' .env 2>/dev/null; then
            echo "Using VITE_API_URL from app/.env."
          else
            echo "::error::VITE_API_URL is not set. Put it in app/.env or add a repository variable under Settings > Secrets and variables > Actions > Variables (see README)."
            exit 1
          fi

      - run: npm ci

      - name: Build
        env:
          VAR_URL: ${{ vars.VITE_API_URL }}
        run: |
          # Only override app/.env when the repository variable is set.
          if [ -n "$VAR_URL" ]; then export VITE_API_URL="$VAR_URL"; fi
          npm run build
          grep -q "script.google.com" dist/assets/*.js || { echo "::error::Built app does not contain the API URL."; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
